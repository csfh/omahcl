default: &default
  store_options:
    # Rate-limit keys hold client IPs, so no entry may outlive an hour. Solid
    # Cache deletes older rows only as writes come in, so a recurring job in
    # config/recurring.yml also deletes them every 5 minutes.
    max_age: <%= 1.hour.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  database: cache
  <<: *default
