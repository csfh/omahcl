name: omahcl

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:55446:5432"
    environment:
      POSTGRES_USER: omahcl
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: omahcl_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omahcl -d omahcl_development"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

networks:
  default:
    name: omahcl

volumes:
  postgres_data:
    name: omahcl_postgres
