name: omarify

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:55446:5432"
    environment:
      POSTGRES_USER: omarify
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: omarify_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omarify -d omarify_development"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

networks:
  default:
    name: omarify

volumes:
  postgres_data:
    name: omarify_postgres
